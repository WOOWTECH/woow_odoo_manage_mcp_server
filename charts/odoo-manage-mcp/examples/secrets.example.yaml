# -----------------------------------------------------------------------------
# Secret for charts/odoo-manage-mcp - PLACEHOLDERS ONLY. Never commit real values.
#
# The chart references this Secret and never renders it (secrets.create=false),
# so a `helm upgrade` can never overwrite a rotated key. Copy this file OUTSIDE
# the repository, replace every REPLACE_ME value, then apply the copy:
#   kubectl --context woow-k3s apply -f /secure/path/secrets.yaml
#
# The predecessor of this file - the Secret inside
# k8s/08-mcp-odoo-ivnvxd-admin.yaml - carried both values in plaintext in this
# PUBLIC repository from 2026-07-09 to the Helm migration. They are gone from
# HEAD but still reachable in the git history, so both MUST be rotated.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: mcp-odoo-ivnvxd-admin-secrets
  # Must equal the release namespace.
  namespace: REPLACE_ME_NAMESPACE
  labels:
    app.kubernetes.io/component: mcp-odoo-ivnvxd-admin
    app.kubernetes.io/part-of: REPLACE_ME_INSTANCE
type: Opaque
stringData:
  # Odoo API key of odoo.user (Standard mode), or that user's password in YOLO
  # mode. Reaches the mcp-server-odoo subprocess as ODOO_API_KEY.
  odoo-api-key: "REPLACE_ME_ODOO_API_KEY"
  # Admin GUI password. Only takes effect with seedConfig.enabled=true; without
  # it the application ignores ADMIN_PASSWORD and the password on a fresh volume
  # is the built-in default "admin".
  admin-password: "REPLACE_ME_ADMIN_PASSWORD"
  # Only needed with seedConfig.jwtSecret=true: without it the app generates a
  # random JWT secret on every start and all logins break on a pod restart.
  jwt-secret: "REPLACE_ME_JWT_SECRET"
