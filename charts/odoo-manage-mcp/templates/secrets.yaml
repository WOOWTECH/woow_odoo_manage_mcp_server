{{- /*
The admin Secret, rendered only with secrets.create=true. By default it is
created out of band from examples/secrets.example.yaml and the chart never
touches it, so `helm upgrade` can never overwrite a rotated Odoo API key.

The previous k8s/08-mcp-odoo-ivnvxd-admin.yaml carried both values in plaintext
in this public repository. They are gone from HEAD; rotate them (see README).
*/ -}}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ include "odooManageMcp.ns" . }}
  labels:
    {{- include "odooManageMcp.labels" . | nindent 4 }}
    app.kubernetes.io/managed-by: Helm
  {{- include "odooManageMcp.keepAnnotations" . | nindent 2 }}
type: Opaque
stringData:
  odoo-api-key: {{ required "secrets.odooApiKey is required when secrets.create=true" .Values.secrets.odooApiKey | quote }}
  admin-password: {{ required "secrets.adminPassword is required when secrets.create=true" .Values.secrets.adminPassword | quote }}
  {{- if .Values.seedConfig.jwtSecret }}
  jwt-secret: {{ required "secrets.jwtSecret is required when secrets.create=true and seedConfig.jwtSecret=true" .Values.secrets.jwtSecret | quote }}
  {{- end }}
{{- end }}
