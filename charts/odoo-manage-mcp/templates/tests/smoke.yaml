{{- /*
`helm test` smoke pod, read-only:
  - /healthz returns 200 {"status":"ok"}
  - GET / returns the admin SPA (200, <div id="root">)
  - POST /api/auth/login with a wrong password returns 401 (auth is enforced)
  - with seedConfig.enabled: POST /api/auth/login with the password from the
    Secret returns 200 and a JWT, proving the Secret actually reached the app
Uses a plain python image: the admin image has no curl.
*/ -}}
{{- if .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-smoke
  namespace: {{ include "odooManageMcp.ns" . }}
  labels:
    app.kubernetes.io/component: smoke-test
    app.kubernetes.io/part-of: {{ include "odooManageMcp.partOf" . }}
  annotations:
    helm.sh/hook: test
    # Kept until the next `helm test` so `helm test --logs` can always read it.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  {{- with .Values.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: smoke
      image: {{ .Values.tests.image }}
      command: [python, -c]
      args:
        - |
          import json, os, urllib.error, urllib.request
          base = os.environ["BASE_URL"]

          def call(path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(
                  base + path, data=data,
                  headers={"Content-Type": "application/json"} if data else {})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()

          s, body = call("/healthz")
          assert s == 200 and json.loads(body).get("status") == "ok", (s, body)
          print("healthz:", body.strip())

          s, body = call("/")
          assert s == 200 and 'id="root"' in body, (s, body[:200])
          print("admin SPA: 200,", len(body), "bytes")

          s, _ = call("/api/auth/login", {"password": "wrong-password-smoke-test"})
          assert s == 401, "login must reject a wrong password, got %s" % s
          print("login rejects a wrong password: 401")

          pw = os.environ.get("ADMIN_PASSWORD")
          if pw:
              s, body = call("/api/auth/login", {"password": pw})
              assert s == 200 and json.loads(body).get("token"), (s, body[:200])
              print("login with the Secret password: 200, JWT issued")

          print("SMOKE OK")
      env:
        - name: BASE_URL
          value: http://{{ include "odooManageMcp.name" . }}-svc.{{ include "odooManageMcp.ns" . }}.svc.cluster.local:{{ .Values.service.port }}
        {{- if .Values.seedConfig.enabled }}
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.name }}
              key: admin-password
        {{- end }}
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 128Mi
{{- end }}
