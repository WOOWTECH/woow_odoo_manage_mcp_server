[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ivnvxd-mcp-admin"
version = "1.0.0"
description = "Web GUI + MCP Proxy + Process Manager for ivnvxd/mcp-server-odoo"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]",
    "httpx",
    "pyjwt>=2.9",
    "python-multipart",
]

[tool.hatch.build.targets.wheel]
packages = ["mcp_admin_core", "ivnvxd_mcp_admin"]
